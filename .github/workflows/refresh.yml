name: Refresh report

on:
  schedule:
    - cron: "30 4,8,13 * * 1-6"   # 10:00, 14:00, 19:00 IST, Monday to Saturday
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Unit tests (SLA rules + Apps Script template)
        run: node --test tests/*.test.js

      - name: Generate synthetic leads and calls
        run: python pipeline/generate_synthetic.py --out data --days 45

      - name: Build report with the shared SLA core
        run: node pipeline/build_report.js data site/data.js

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

      - id: deploy
        uses: actions/deploy-pages@v4
